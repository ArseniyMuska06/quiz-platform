services:
  db:
    build:
      context: ./server
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: quizora
      POSTGRES_USER: quizora_app
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in server/.env}
    volumes:
      - quizora_pgdata:/var/lib/postgresql
  backend:
    build: ./server
    command: ["node", "--import", "tsx", "src/index.ts"]
    env_file:
      - ./server/.env
    environment:
      PGHOST: db
      PGPORT: "5432"
    depends_on:
      - db
    develop:
      watch:
        - action: sync+restart
          path: ./server/src
          target: /app/src
  frontend:
    build: .
    environment:
      API_PROXY_TARGET: http://backend:3001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src:/app/src
    ports:
      - "127.0.0.1:5174:5173"
    depends_on:
      - backend

volumes:
  quizora_pgdata: